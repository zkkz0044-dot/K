name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clean-install-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verify release source manifest
        run: python scripts/verify_sha256.py

      - name: Run isolated clean-install validation
        run: sudo env "PATH=$PATH" bash scripts/test_clean_install.sh
